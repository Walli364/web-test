name: Docker Deploy Pipeline

on:
  push:
    branches:
      - devops # Sirf is branch par chalega

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t nginx:alpine .
        
      - name: Test Image
        run: docker run -d -p 8080:80 nginx:alpine